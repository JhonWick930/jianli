<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A8CFF"/>
      <stop offset="100%" stop-color="#1E4FD8"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 底 -->
  <rect width="512" height="512" rx="114" fill="url(#g)"/>
  <rect width="512" height="512" rx="114" fill="url(#s)"/>

  <!-- 书本/文档主体 -->
  <g transform="translate(256,258)">
    <!-- 纸张 -->
    <rect x="-112" y="-124" width="224" height="264" rx="20" fill="#FFFFFF" opacity=".97"/>
    <!-- 折角 -->
    <path d="M112 -124 L112 -60 L44 -124 Z" fill="#C9DCFF"/>
    <!-- 行 -->
    <rect x="-76" y="-72" width="152" height="15" rx="7.5" fill="#3370FF" opacity=".85"/>
    <rect x="-76" y="-32" width="118" height="15" rx="7.5" fill="#A8C0E8"/>
    <rect x="-76" y="8" width="140" height="15" rx="7.5" fill="#A8C0E8"/>
    <rect x="-76" y="48" width="96" height="15" rx="7.5" fill="#A8C0E8"/>

    <!-- 底部进度条 -->
    <rect x="-76" y="96" width="152" height="14" rx="7" fill="#E4E9F2"/>
    <rect x="-76" y="96" width="104" height="14" rx="7" fill="#3F9E4D"/>
  </g>

  <!-- 右上角对勾 -->
  <g transform="translate(374,146)">
    <circle r="62" fill="#3F9E4D"/>
    <circle r="62" fill="none" stroke="#FFFFFF" stroke-width="7" opacity=".55"/>
    <path d="M-30 2 L-9 24 L32 -22" fill="none" stroke="#FFFFFF" stroke-width="15"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
