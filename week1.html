<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>监理备考 · 第1周 在线测验（含错题库）</title>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#1f2329; --sub:#646a73; --line:#e4e6eb;
  --brand:#3370ff; --brand-soft:#eaf1ff;
  --ok:#3f9e4d; --ok-soft:#eaf7ec;
  --no:#d83931; --no-soft:#fdeeed;
  --warn:#b8770b; --warn-soft:#fdf4e3;
  --radius:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  padding:0 0 100px;
}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}

header{background:linear-gradient(135deg,#3370ff 0%,#1e4fd8 100%);color:#fff;padding:26px 0 22px;margin-bottom:20px}
header .wrap{padding:0 16px}
header h1{margin:0 0 6px;font-size:21px;font-weight:600;letter-spacing:.3px}
header .meta{font-size:13px;opacity:.9;line-height:1.8}

.sticky{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.sticky .wrap{display:flex;align-items:center;gap:14px;height:50px}
.bar{flex:1;height:6px;background:#eef0f3;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--brand);border-radius:99px;transition:width .3s}
.stat{font-size:13px;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
.stat b{color:var(--ink);font-size:15px}

/* 视图切换 */
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{
  padding:8px 18px;border-radius:99px;border:1px solid var(--line);background:#fff;
  font-size:14px;font-weight:500;color:var(--sub);cursor:pointer;transition:.15s;font-family:inherit;
}
.tab:hover{border-color:#b9caf0}
.tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.tab .bubble{
  display:inline-block;min-width:18px;height:18px;line-height:18px;padding:0 5px;
  border-radius:99px;background:#eef0f3;color:var(--sub);font-size:11px;font-weight:600;
  margin-left:6px;vertical-align:1px;
}
.tab.on .bubble{background:rgba(255,255,255,.28);color:#fff}

.day{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px;padding-left:2px}
.day:first-of-type{margin-top:8px}
.day h2{margin:0;font-size:16px;font-weight:600}
.day .scope{font-size:13px;color:var(--sub)}

.q{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;transition:border-color .2s}
.q.answered{border-color:#cdd6e5}
.qhead{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.tag{flex:0 0 auto;font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--brand-soft);color:var(--brand);letter-spacing:.4px;line-height:1.5;margin-top:2px}
.tag.multi{background:#f0ebff;color:#7a4ddb}
.qtext{flex:1;margin:0;font-size:15px;font-weight:500;line-height:1.65}
.qtext .sub{display:block;font-weight:400;color:var(--sub);font-size:13px;margin-top:4px}

.opts{margin:0;padding:0;list-style:none}
.opt{display:flex;gap:11px;align-items:flex-start;padding:9px 12px;margin-bottom:6px;border:1px solid var(--line);border-radius:8px;cursor:pointer;transition:.15s;background:#fff;user-select:none}
.opt:hover{border-color:#b9caf0;background:#fafbfe}
.opt .key{flex:0 0 22px;height:22px;border-radius:50%;background:#f2f3f5;color:var(--sub);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:.15s}
.opt .txt{flex:1;font-size:14.5px;line-height:1.65;color:var(--ink)}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .key{background:var(--brand);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .key{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--no);background:var(--no-soft)}
.opt.wrong .key{background:var(--no);color:#fff}
.q.done .opt{cursor:default}
.q.done .opt:hover{border-color:inherit;background:inherit}
.q.done .opt.right:hover{background:var(--ok-soft);border-color:var(--ok)}
.q.done .opt.wrong:hover{background:var(--no-soft);border-color:var(--no)}

.exp{display:none;margin-top:12px;padding:12px 14px;border-radius:8px;background:#f7f8fa;border-left:3px solid var(--brand);font-size:14px;line-height:1.75}
.exp.show{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.exp .verdict{font-weight:600;margin-bottom:6px;font-size:14px}
.exp .verdict.y{color:var(--ok)}
.exp .verdict.n{color:var(--no)}
.exp p{margin:0 0 6px}
.exp p:last-child{margin-bottom:0}
.exp .why{color:var(--sub)}
.exp table{border-collapse:collapse;width:100%;margin:8px 0;font-size:13.5px}
.exp th,.exp td{border:1px solid var(--line);padding:6px 9px;text-align:left}
.exp th{background:#eef0f3;font-weight:600;font-size:13px}
.exp .hl{color:var(--brand);font-weight:600}
.exp code{background:#eef0f3;padding:1px 5px;border-radius:4px;font-size:13px;font-family:SFMono-Regular,Consolas,monospace}

/* 错题库 */
.wrongbox{display:none}
.wrongbox.show{display:block}
.empty{
  background:#fff;border:1px dashed var(--line);border-radius:var(--radius);
  padding:44px 20px;text-align:center;color:var(--sub);font-size:14px;
}
.empty .ico{font-size:34px;display:block;margin-bottom:10px;opacity:.35}
.wcard{border-left:3px solid var(--no)}
.wcard .wtop{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  margin-bottom:10px;flex-wrap:wrap;
}
.wcard .src{font-size:12px;color:var(--sub);font-weight:600}
.wcard .err{
  font-size:12px;padding:2px 8px;border-radius:99px;
  background:var(--no-soft);color:var(--no);font-weight:600;white-space:nowrap;
}
.wcard .err.cnt{background:var(--warn-soft);color:var(--warn)}
.wcard .mine{
  font-size:13.5px;color:var(--no);margin-bottom:4px;
}
.wcard .mine b{font-weight:600}
.wcard .theirs{font-size:13.5px;color:var(--ok);margin-bottom:8px}
.wcard .theirs b{font-weight:600}
.wcard .exp{margin-top:10px;display:block}

.wbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.wbar .info{font-size:13px;color:var(--sub);flex:1}
.mini{
  padding:7px 14px;border-radius:7px;border:1px solid var(--line);background:#fff;
  font-size:13px;color:var(--sub);cursor:pointer;font-family:inherit;transition:.15s;
}
.mini:hover{border-color:var(--brand);color:var(--brand)}
.mini.danger:hover{border-color:var(--no);color:var(--no)}

footer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 0;box-shadow:0 -2px 12px rgba(0,0,0,.05);z-index:60}
footer .wrap{display:flex;gap:10px;align-items:center}
.btn{flex:1;height:44px;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:.15s;font-family:inherit}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:#1e5fe0}
.btn.primary:disabled{background:#c3cdde;cursor:not-allowed}
.btn.ghost{flex:0 0 auto;padding:0 18px;background:#f2f3f5;color:var(--sub)}
.btn.ghost:hover{background:#e8eaed}

.veil{display:none;position:fixed;inset:0;background:rgba(20,24,32,.5);z-index:100;align-items:center;justify-content:center;padding:20px}
.veil.show{display:flex;animation:fade .2s}
.panel{background:#fff;border-radius:14px;padding:26px 24px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.panel h3{margin:0 0 4px;font-size:17px;font-weight:600}
.panel .big{font-size:44px;font-weight:700;color:var(--brand);line-height:1.2;margin:10px 0 2px}
.panel .pct{font-size:14px;color:var(--sub);margin-bottom:16px}
.panel .lines{text-align:left;font-size:13.5px;color:var(--sub);line-height:1.9;margin-bottom:14px}
.panel .lines span{float:right;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.panel .lines::after{content:'';display:block;clear:both}
.panel .pick{
  text-align:left;font-size:13px;color:var(--sub);background:#f7f8fa;
  border-radius:8px;padding:10px 12px;margin-bottom:16px;max-height:130px;overflow:auto;
}
.panel .pick b{color:var(--no)}
.panel .btn{width:100%}
.panel .btn+.btn{margin-top:8px}
.toast{
  position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(10px);
  background:rgba(31,35,41,.92);color:#fff;padding:9px 18px;border-radius:8px;
  font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:200;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>监理工程师备考 · 第 1 周测验</h1>
    <div class="meta">概论法规 第1章 + 第4章 ｜ 共 15 题 ｜ 提交后：<b style="color:#8ef0a4">绿色=正确</b>　<b style="color:#ffb3ae">红色=错误</b></div>
  </div>
</header>

<div class="sticky">
  <div class="wrap">
    <div class="bar"><i id="bar"></i></div>
    <div class="stat">已答 <b id="cnt">0</b>/15</div>
  </div>
</div>

<div class="wrap">
  <div class="tabs">
    <button class="tab on" data-v="quiz">做题</button>
    <button class="tab" data-v="wrong">错题库<span class="bubble" id="wcnt">0</span></button>
  </div>

  <div id="app" class="quizbox"></div>
  <div id="wapp" class="wrongbox"></div>
</div>

<footer>
  <div class="wrap" id="footQuiz">
    <button class="btn ghost" id="reset">重做</button>
    <button class="btn primary" id="submit" disabled>提交全部答案</button>
  </div>
  <div class="wrap" id="footWrong" style="display:none">
    <button class="btn ghost" id="export">导出错题库</button>
    <button class="btn ghost" id="clearWrong">清空错题库</button>
  </div>
</footer>

<div class="veil" id="veil">
  <div class="panel">
    <h3>本周测验结果</h3>
    <div class="big" id="score">0</div>
    <div class="pct" id="pct"></div>
    <div class="lines" id="detail"></div>
    <div class="pick" id="picklist"></div>
    <button class="btn primary" id="close">回去看解析</button>
    <button class="btn ghost" id="goWrong">查看错题库</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ 题库数据 ============ */
const DATA = [
 {day:"周一 9/21", scope:"监理涵义 · 三控两管一协调", qs:[
  {t:"single", q:"建设工程监理的行为主体是（　）。", o:["建设单位","工程监理单位","政府主管部门","施工总承包单位"], a:[1],
   e:"<p>建设工程监理的<span class='hl'>行为主体是工程监理单位</span>（《建筑法》第31条）。</p><p class='why'>建设单位自行管理属自身管理活动；政府主管部门的监督管理属行政性监督管理；施工总承包单位对分包单位的监督管理也不属于工程监理。</p>"},
  {t:"single", q:"建设工程监理的基本职责可概括为（　）。", o:["三控两管一协调 + 安全生产管理法定职责","四控两管一协调","三控三管一协调","三控一管一协调"], a:[0],
   e:"<p>正确答案 <span class='hl'>A</span>。基本职责＝\"三控两管一协调\"，此外还需履行建设工程安全生产管理的法定职责。</p><p class='why'>⚠️ 教材明确：将监理概括为\"四控两管一协调\"或\"三控三管一协调\"<b>均不准确，也不科学</b>。B、C 都是教材点名的错误说法。</p>"},
  {t:"single", q:"关于建设工程监理的实施范围，下列说法正确的是（　）。", o:["工程监理定位于设计阶段","工程监理定位于施工阶段，勘察、设计、保修等阶段的服务属相关服务","工程监理涵盖工程建设全过程","工程监理仅涵盖施工阶段，不含相关服务"], a:[1],
   e:"<p>正确答案 <span class='hl'>B</span>。工程监理<span class='hl'>定位于施工阶段</span>；在工程勘察、设计、保修等阶段提供的服务活动均为<span class='hl'>相关服务</span>。</p>"}
 ]},
 {day:"周二 9/22", scope:"监理的四项性质", qs:[
  {t:"single", q:"下列关于建设工程监理服务性的说法，错误的是（　）。", o:["工程监理单位不直接进行工程设计","工程监理单位不直接进行工程施工","工程监理单位不向建设单位承包工程造价","工程监理单位参与施工单位的利润分成"], a:[3],
   e:"<p>正确答案 <span class='hl'>D</span>。教材原文：工程监理单位\"既不向建设单位承包工程造价，<b>也不参与施工单位的利润分成</b>\"。</p><p class='why'>服务性的四个要点：①不直接设计、不直接施工；②不承包造价、不参与利润分成；③<b>不具有工程建设重大问题的决策权</b>；④服务对象是建设单位，但不能完全取代建设单位的管理活动。</p>"},
  {t:"single", q:"建设工程监理的性质不包括（　）。", o:["服务性","科学性","盈利性","公平性"], a:[2],
   e:"<p>正确答案 <span class='hl'>C</span>。监理的四项性质是<span class='hl'>服务性、科学性、独立性、公平性</span>，<b>没有\"盈利性\"</b>。</p>"},
  {t:"single", q:"工程监理单位公平地实施监理的基本前提是（　）。", o:["服务性","科学性","独立性","公平性"], a:[2],
   e:"<p>正确答案 <span class='hl'>C</span>。<span class='hl'>独立性</span>是工程监理单位公平地实施监理的<b>基本前提</b>。</p><p class='why'>注意区分：<b>独立性</b>＝公平实施监理的<b>基本前提</b>；<b>公平性</b>＝行业长期生存和发展的<b>基本职业道德准则</b>。</p>"}
 ]},
 {day:"周三 9/23", scope:"强制监理范围 · 必须招标门槛", qs:[
  {t:"single", q:"根据《建设工程质量管理条例》，必须实行监理的大中型公用事业工程，其项目总投资额应在（　）以上。", o:["1000 万元","2000 万元","3000 万元","5000 万元"], a:[2],
   e:"<p>正确答案 <span class='hl'>C</span>。大中型公用事业工程：项目总投资额在 <span class='hl'>3000 万元</span>以上。</p><p class='why'>注意：第5类\"国家规定必须实行监理的其他工程\"中的<b>基础设施项目</b>也适用 3000 万元门槛，但<b>学校、影剧院、体育场馆项目不设投资额门槛</b>。</p>"},
  {t:"single", q:"成片开发建设的住宅小区工程，建筑面积在（　）以上的必须实行监理。", o:["3 万 m²","5 万 m²","8 万 m²","10 万 m²"], a:[1],
   e:"<p>正确答案 <span class='hl'>B</span>。成片开发建设的住宅小区工程，建筑面积在 <span class='hl'>5 万 m²</span> 以上的<b>必须</b>实行监理。</p><p class='why'>5 万 m² <b>以下</b>的<b>可以</b>实行监理，具体范围和规模标准由<b>省、自治区、直辖市</b>人民政府建设行政主管部门规定。此外，为保证住宅质量，<b>高层住宅</b>及<b>地基、结构复杂的多层住宅</b>应当实行监理。</p>"},
  {t:"multi", q:"根据《必须招标的工程项目规定》，必须招标的标准有（　）。", o:["施工单项合同估算价 400 万元以上","重要设备、材料等货物采购单项合同估算价 200 万元以上","勘察、设计、监理等服务采购单项合同估算价 100 万元以上","施工单项合同估算价 100 万元以上","服务采购单项合同估算价 200 万元以上"], a:[0,1,2],
   e:"<p>正确答案 <span class='hl'>ABC</span>。三个门槛数字必须钉死：</p><table><tr><th>采购类型</th><th>门槛</th></tr><tr><td>施工</td><td><b>400 万元</b></td></tr><tr><td>重要设备、材料等货物</td><td><b>200 万元</b></td></tr><tr><td>勘察、设计、监理等服务</td><td><b>100 万元</b></td></tr></table><p class='why'>记忆锚点：按工程造价量级排序就是 <code>400 &gt; 200 &gt; 100</code>。</p>"}
 ]},
 {day:"周四 9/24", scope:"监理单位职责 · 两个签字", qs:[
  {t:"single", q:"未经（　）签字，建筑材料、建筑构配件和设备不得在工程上使用或者安装。", o:["总监理工程师","监理工程师","专业监理工程师代表","建设单位代表"], a:[1],
   e:"<p>正确答案 <span class='hl'>B</span>。<b>监理工程师</b>签字 → 管<b>材料使用、构配件设备安装、下一道工序</b>。</p>"},
  {t:"single", q:"未经（　）签字，建设单位不拨付工程款，不进行竣工验收。", o:["监理员","专业监理工程师","总监理工程师","监理单位负责人"], a:[2],
   e:"<p>正确答案 <span class='hl'>C</span>。<b>总监理工程师</b>签字 → 管<b>拨付工程款、竣工验收</b>。</p><p class='why'>依据：《建设工程质量管理条例》第37条。两个签字的主体千万别换错。</p>"},
  {t:"multi", q:"根据《建设工程安全生产管理条例》第14条，工程监理单位发现存在安全事故隐患，情况严重的，应当（　）。", o:["要求施工单位整改","要求施工单位暂时停止施工","及时报告建设单位","立即向有关主管部门报告","直接下达工程暂停令并自行组织抢险"], a:[1,2],
   e:"<p>正确答案 <span class='hl'>BC</span>。\"情况严重\"时应：<b>要求施工单位暂时停止施工</b> + <b>及时报告建设单位</b>。</p><p class='why'>三个阶段是递进的，不能混：</p><table><tr><th>情形</th><th>处理</th></tr><tr><td>发现隐患</td><td>要求整改 ← A 选项</td></tr><tr><td><b>情况严重</b></td><td><b>暂停施工 + 报建设单位</b> ← 本题</td></tr><tr><td>拒不整改／不停止施工</td><td>报有关主管部门 ← D 选项</td></tr></table><p class='why'>E 错：监理无权自行组织抢险。</p>"}
 ]},
 {day:"周五 9/25", scope:"职责边界 · 措施四分类", qs:[
  {t:"single", q:"根据历年真题考查结论，下列工作安排中，不妥当的是（　）。", o:["总监理工程师审批监理实施细则","专业监理工程师编制监理实施细则","总监理工程师代表审批（专项）施工方案","专业监理工程师检查进场工程材料、构配件和设备的质量"], a:[2],

const WEEK = "第1周";
const WEEK_ID = "w1";
const STORE = "jl_wrongbook_" + WEEK_ID;   // 本周错题库（各自独立）
const ALL_STORE = "jl_wrongbook_all";      // 跨周总错题库
const DONE_STORE = "jl_done_" + WEEK_ID;   // 本周完成记录

/* ============ 状态 ============ */
const app = document.getElementById('app');
const wapp = document.getElementById('wapp');
const total = DATA.reduce((s,d)=>s+d.qs.length,0);
const picked = {};
const locked = {};
let n = 0;
DATA.forEach((d,di)=>d.qs.forEach((q,qi)=>{ q._k = di+'-'+qi; q._day = d.day; q._scope = d.scope; }));

/* ============ 错题库存取 ============ */
function loadBook(){
  try{ return JSON.parse(localStorage.getItem(STORE)) || []; }catch(e){ return []; }
}
function saveBook(list){
  try{ localStorage.setItem(STORE, JSON.stringify(list)); }catch(e){}
  refreshBadge();
}
function refreshBadge(){
  const list = loadBook();
  const el = document.getElementById('wcnt');
  el.textContent = list.length;
  el.style.display = list.length ? 'inline-block' : 'none';
}

/* ============ 渲染题目 ============ */
function render(){
  let html = '';
  DATA.forEach(d=>{
    html += `<div class="day"><h2>${d.day}</h2><span class="scope">${d.scope}</span></div>`;
    d.qs.forEach(q=>{
      const k = q._k;
      const tg = q.t==='multi' ? '<span class="tag multi">多选</span>' : '<span class="tag">单选</span>';
      html += `<div class="q" id="q-${k}">
        <div class="qhead">${tg}<p class="qtext">${q.q}</p></div>
        <ul class="opts">`;
      q.o.forEach((o,oi)=>{
        html += `<li class="opt" data-k="${k}" data-i="${oi}">
          <span class="key">${'ABCDE'[oi]}</span><span class="txt">${o}</span></li>`;
      });
      html += `</ul><div class="exp" id="e-${k}"></div></div>`;
    });
  });
  app.innerHTML = html;

  app.querySelectorAll('.opt').forEach(el=>{
    el.addEventListener('click',()=>{
      const k = el.dataset.k, i = +el.dataset.i;
      if(locked[k]) return;
      const q = findQ(k);
      if(!picked[k]) picked[k] = new Set();
      const set = picked[k];
      if(q.t==='multi'){ set.has(i) ? set.delete(i) : set.add(i); }
      else { set.clear(); set.add(i); }
      syncUI(k);
    });
  });
  updateProgress();
}

function findQ(k){
  const [di,qi] = k.split('-').map(Number);
  return DATA[di].qs[qi];
}

function syncUI(k){
  const set = picked[k] || new Set();
  const box = document.getElementById('q-'+k);
  box.querySelectorAll('.opt').forEach(el=>{
    el.classList.toggle('sel', set.has(+el.dataset.i));
  });
  box.classList.toggle('answered', set.size>0);
  updateProgress();
}

function updateProgress(){
  n = Object.values(picked).filter(s=>s && s.size>0).length;
  document.getElementById('cnt').textContent = n;
  document.getElementById('bar').style.width = (n/total*100)+'%';
  document.getElementById('submit').disabled = n===0;
}

/* ============ 判分 ============ */
function ansStr(arr){ return arr.map(i=>'ABCDE'[i]).join(''); }

function grade(){
  let right = 0;
  const perDay = {};
  const newWrong = [];

  DATA.forEach(d=>{
    perDay[d.day] = {r:0, t:d.qs.length};
    d.qs.forEach(q=>{
      const k = q._k;
      locked[k] = true;
      const set = picked[k] || new Set();
      const correct = new Set(q.a);
      const isRight = set.size===correct.size && [...set].every(x=>correct.has(x));
      if(isRight){ right++; perDay[d.day].r++; }

      const box = document.getElementById('q-'+k);
      box.classList.add('done');
      box.querySelectorAll('.opt').forEach(el=>{
        const i = +el.dataset.i;
        el.classList.remove('sel');
        if(correct.has(i)) el.classList.add('right');
        else if(set.has(i)) el.classList.add('wrong');
      });

      const your = ansStr([...set].sort());
      const ans = ansStr(q.a);
      const e = document.getElementById('e-'+k);
      e.innerHTML = `<div class="verdict ${isRight?'y':'n'}">${isRight?'✓ 回答正确':'✗ 回答错误'}　你的答案：${your||'未作答'}　正确答案：${ans}</div>` + q.e;
      e.classList.add('show');

      if(!isRight){
        newWrong.push({
          week: WEEK, day: q._day, scope: q._scope,
          q: q.q, o: q.o, t: q.t,
          your: your || '(未作答)', ans: ans,
          e: q.e,
          times: 1,
          last: new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})
        });
      }
    });
  });

  mergeWrong(newWrong);

  // 弹窗
  document.getElementById('score').textContent = right + ' / ' + total;
  document.getElementById('pct').textContent = `正确率 ${Math.round(right/total*100)}%`;
  let det = '';
  Object.entries(perDay).forEach(([day,v])=>{
    det += `${day.slice(0,2)}　<span>${v.r} / ${v.t}</span><br>`;
  });
  document.getElementById('detail').innerHTML = det;

  const pl = document.getElementById('picklist');
  if(newWrong.length){
    pl.innerHTML = `<b>本次新增错题 ${newWrong.length} 道：</b><br>` +
      newWrong.map(w=>`· ${w.day.slice(0,2)}　${w.q.slice(0,26)}…`).join('<br>');
  }else{
    pl.innerHTML = '<b style="color:#3f9e4d">全对，本次没有新增错题 🎉</b>';
  }

  document.getElementById('veil').classList.add('show');
  document.getElementById('submit').disabled = true;
  document.getElementById('submit').textContent = '已提交（可重做）';

  // 记录完成情况，供目录页统计
  try{
    const rec = {right:right, total:total, rate:Math.round(right/total*100),
                 date:new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})};
    localStorage.setItem(DONE_STORE, JSON.stringify(rec));
    // 同步到跨周总错题库（按周标记，便于以后汇总）
    const allRaw = localStorage.getItem(ALL_STORE);
    let all = allRaw ? JSON.parse(allRaw) : [];
    newWrong.forEach(it=>{
      const idx = all.findIndex(x=>x.q === it.q && x.week === it.week);
      if(idx >= 0){
        all[idx].times = (all[idx].times||1) + 1;
        all[idx].your = it.your;
        all[idx].last = it.last;
      }else{
        all.push(it);
      }
    });
    localStorage.setItem(ALL_STORE, JSON.stringify(all));
  }catch(e){}
}

/* 合并进错题库：同一题重复错则累加次数 */
function mergeWrong(items){
  const list = loadBook();
  items.forEach(it=>{
    const idx = list.findIndex(x=>x.q === it.q);
    if(idx >= 0){
      list[idx].times = (list[idx].times||1) + 1;
      list[idx].your = it.your;
      list[idx].last = it.last;
    }else{
      list.push(it);
    }
  });
  saveBook(list);
}

/* ============ 错题库渲染 ============ */
function renderWrong(){
  const list = loadBook();
  if(!list.length){
    wapp.innerHTML = `<div class="empty"><span class="ico">○</span>
      错题库还是空的。<br>提交答卷后，做错的题会自动收进这里。</div>`;
    return;
  }

  // 按次数排序（错得多的在前），再按日程
  list.sort((a,b)=> (b.times||1)-(a.times||1));

  let html = `<div class="wbar">
    <div class="info">共 <b>${list.length}</b> 道错题　｜　合计做错 <b>${list.reduce((s,x)=>s+(x.times||1),0)}</b> 次</div>
  </div>`;

  list.forEach((w,i)=>{
    const tg = w.t==='multi' ? '<span class="tag multi">多选</span>' : '<span class="tag">单选</span>';
    const times = w.times||1;
    const badge = times>1
      ? `<span class="err cnt">重复错 ${times} 次</span>`
      : `<span class="err">错 1 次</span>`;
    html += `<div class="q wcard" data-qi="${i}">
      <div class="wtop">
        <span class="src">${w.week} · ${w.day}　${w.scope}　最近：${w.last||''}</span>
        ${badge}
      </div>
      <div class="qhead">${tg}<p class="qtext">${w.q}</p></div>
      <ul class="opts">`;
    w.o.forEach((o,oi)=>{
      html += `<li class="opt"><span class="key">${'ABCDE'[oi]}</span><span class="txt">${o}</span></li>`;
    });
    html += `</ul>
      <div class="mine">你的答案：<b>${w.your}</b></div>
      <div class="theirs">正确答案：<b>${w.ans}</b></div>
      <div class="exp show">${w.e}</div>
    </div>`;
  });
  wapp.innerHTML = html;

  // 标出正误
  wapp.querySelectorAll('.wcard').forEach(card=>{
    const w = list[+card.dataset.qi];
    const correct = new Set(w.ans.split('').map(c=>'ABCDE'.indexOf(c)));
    const mine = new Set(w.your === '(未作答)' ? [] : w.your.split('').map(c=>'ABCDE'.indexOf(c)));
    card.querySelectorAll('.opt').forEach(el=>{
      const i = +el.dataset.i;
      if(correct.has(i)) el.classList.add('right');
      else if(mine.has(i)) el.classList.add('wrong');
    });
  });
}

/* ============ 视图切换 ============ */
let view = 'quiz';
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    view = t.dataset.v;
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x===t));
    app.style.display = view==='quiz' ? '' : 'none';
    wapp.classList.toggle('show', view==='wrong');
    document.getElementById('footQuiz').style.display = view==='quiz' ? '' : 'none';
    document.getElementById('footWrong').style.display = view==='wrong' ? '' : 'none';
    if(view==='wrong') renderWrong();
    window.scrollTo({top:0,behavior:'smooth'});
  });
});

/* ============ 按钮 ============ */
document.getElementById('submit').addEventListener('click', ()=>{
  const un = total - Object.values(picked).filter(s=>s&&s.size>0).length;
  if(un>0 && !confirm(`还有 ${un} 题没作答，确定提交吗？`)) return;
  grade();
  window.scrollTo({top:0,behavior:'smooth'});
});

document.getElementById('close').addEventListener('click',()=>{
  document.getElementById('veil').classList.remove('show');
});

document.getElementById('goWrong').addEventListener('click',()=>{
  document.getElementById('veil').classList.remove('show');
  document.querySelector('.tab[data-v="wrong"]').click();
});

document.getElementById('reset').addEventListener('click',()=>{
  if(confirm('清空本次作答、重新做题？（错题库不受影响）')) location.reload();
});

document.getElementById('clearWrong').addEventListener('click',()=>{
  if(confirm('确定清空整个错题库？此操作不可恢复。')){
    saveBook([]); renderWrong(); toast('错题库已清空');
  }
});

/* 导出错题库 */
document.getElementById('export').addEventListener('click',()=>{
  const list = loadBook();
  if(!list.length){ toast('错题库是空的'); return; }

  let md = `# 错题库｜${WEEK}\n\n`;
  md += `> 导出时间：${new Date().toLocaleString('zh-CN')}\n`;
  md += `> 共 ${list.length} 道错题，累计做错 ${list.reduce((s,x)=>s+(x.times||1),0)} 次\n\n---\n\n`;

  list.forEach((w,i)=>{
    md += `## 错题 ${i+1}｜${w.day}　${w.scope}\n\n`;
    md += `**题目**（${w.t==='multi'?'多选':'单选'}）：${w.q}\n\n`;
    w.o.forEach((o,oi)=> md += `- ${'ABCDE'[oi]}. ${o}\n`);
    md += `\n**你的答案**：${w.your}　｜　**正确答案**：${w.ans}`;
    if((w.times||1) > 1) md += `　｜　**已错 ${w.times} 次**`;
    md += `\n\n**解析**：${w.e.replace(/<[^>]+>/g,'').replace(/\n+/g,' ')}\n\n---\n\n`;
  });

  const blob = new Blob([md], {type:'text/markdown;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `错题库｜${WEEK}｜${new Date().toISOString().slice(0,10)}.md`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('已导出，可发给我合并总错题库');
});

/* Toast */
let tmr;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(tmr);
  tmr = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* 启动 */
render();
refreshBadge();
</script>
</body>
</html>
